[project]
name = "code-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bert-score>=0.3.13",
    "boto3>=1.42.33",
    "datasets>=4.4.2",
    "litellm>=1.80.16",
    "polars>=1.38.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "seaborn>=0.13.2",
    "streamlit>=1.55.0",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "poethepoet>=0.42.1",
    "ruff>=0.15.4",
]

[tool.poe.tasks]
lint  = "ruff check ."
format   = "ruff format ."
ui = "streamlit run annotate_ui/app.py"


[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format=true

