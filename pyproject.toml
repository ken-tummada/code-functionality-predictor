[project]
name = "code-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "bert-score>=0.3.13",
    "bitsandbytes>=0.49.2",
    "boto3>=1.42.33",
    "click>=8.3.1",
    "datasets>=4.4.2",
    "litellm>=1.80.16",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "swebench",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
    "urllib3>=2.6.3",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
]

[tool.uv.workspace]
members = [
    "libs/SWE-bench",
]

[tool.uv.sources]
swebench = { workspace = true, editable = true }
